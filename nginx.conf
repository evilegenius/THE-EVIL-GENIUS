events {}

http {
    resolver 8.8.8.8 ipv6=off valid=30s;

    server {
        listen 8080;

        # VLESS
        location = /TG-@The_Evil_Eyes {
            proxy_pass http://panel.dieu-genie-du-mal.uk:10001;

            proxy_http_version 1.1;
            proxy_set_header Host panel.dieu-genie-du-mal.uk;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_buffering off;
            proxy_cache off;

            proxy_connect_timeout 60s;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # VMess
        location = /wha-@dieugeniedumal {
            proxy_pass http://panel.dieu-genie-du-mal.uk:10002;

            proxy_http_version 1.1;
            proxy_set_header Host panel.dieu-genie-du-mal.uk;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_buffering off;
            proxy_cache off;

            proxy_connect_timeout 60s;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Trojan
        location = /DGM {
            proxy_pass http://panel.dieu-genie-du-mal.uk:10003;

            proxy_http_version 1.1;
            proxy_set_header Host panel.dieu-genie-du-mal.uk;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_buffering off;
            proxy_cache off;

            proxy_connect_timeout 60s;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Réponse pour les autres chemins
        location / {
            return 404;
        }
    }
}
